services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense_local
      POSTGRES_DB: expense_audit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - expense_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_audit"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  expense_pg:
