[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-audit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.38,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6", "pillow>=11,<13"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.setuptools.package-data]
"app.features.extraction" = ["prompts/*.txt"]
"app.features.audits" = ["prompts/*.txt", "policy.json"]
"app.features.usage" = ["pricing.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL", "live: consumes Cloudflare free allowance"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
